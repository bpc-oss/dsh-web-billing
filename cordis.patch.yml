# dsh-web-billing bundle layer / 组合包配置层。
#
# Installed via `dsh plugin --profile <name> add dsh-web-billing`
# (or `add github:<owner>/dsh-web-billing`, or a tarball). This layer is applied
# after the profile's base bundles; users can override any row below in their
# own profile `cordis.patch.yml` (later layers win, and a patch replaces the
# targeted row's whole config).
#
# 安装方式：`dsh plugin --profile <name> add dsh-web-billing`（或
# `add github:<owner>/dsh-web-billing`、tarball）。本层在 profile 基础组合包
# 之后应用；用户可在自己的 profile `cordis.patch.yml` 里按 id 覆盖本层任意行
# （后应用的层胜出，且覆盖会替换整份 config）。
#
# Defaults are enough: the official price schedule is built into lib/pricing.js
# (incl. the 2026-08-17 peak/off-peak pricing: peak 09:00-12:00 / 14:00-18:00
# Beijing, off-peak at half price); policy changes apply automatically.
# NOTE: setting `prices` for a model freezes that model's price (it overrides
# the official policy, incl. peak/off-peak) — usually not needed.
#
# 默认配置即可：官方价格表内置在 lib/pricing.js（含 2026-08-17 起的峰谷定价：
# 高峰 09:00-12:00 / 14:00-18:00 北京时间，空闲半价），政策变化自动生效。
# 注意：给某个模型配置 `prices` 会「冻结」该模型价格（覆盖官方政策，包括峰谷
# 时段），一般不需要配置。
- insert:
    - id: web-billing
      name: dsh-web-billing
      config:
        currency: CNY
        symbol: '¥'
        symbolUsd: '$'
        displayCurrency: auto
        # officialPricing: auto            # auto=official-policy pricing (default); off=user prices only / auto=官方政策自动计价（默认）；off=只用 prices
        # timezone: Asia/Shanghai          # peak/off-peak timezone (default) / 峰谷判定时区（默认）
        # peakWindows: [[9,12],[14,18]]    # peak windows (default) / 高峰时段（默认）
        # prices:                          # optional: freeze a model's price (¥/1M, applies to both currencies) / 可选：冻结某模型价格（¥/1M，同时作用于美元价）
        #   my-custom-model: { input: 1, cacheRead: 0.05, output: 2 }
        # usdPrices:                       # optional: USD price overrides ($/1M) / 可选：美元价覆盖（$/1M）
        #   my-custom-model: { input: 0.14, cacheRead: 0.007, output: 0.28 }
        # policyOverrides:                 # optional: append future official policies without code changes / 可选：官方未来调价时在此追加政策（无需改代码）
        #   - since: '2026-09-01T00:00:00+08:00'
        #     label: example / 示例
        #     prices:
        #       deepseek-v4-flash: { input: 5, cacheRead: 0.1, output: 10 }
        # localProviders:                  # optional: self-hosted providers — priced at the official rate as "nominal
        #   - dgx-spark-vllm               #   value"; actual cost = localCostPerM (default 0), the difference is
        # localCostPerM: 0                 #   shown as "saved" in the UI / 可选：本地 provider 名单——按官方价计算
        #                                 #   「名义价值」；实际成本 = localCostPerM（默认 0 = 免费），
        #                                 #   差值计入 UI 的「已节省」
